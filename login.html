<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="author" content="Camilo Dominguez" />
        <meta name="keywords" content="electrodomesticos, tienda, login" />
        <meta name="description" content="ElectroHogar - Iniciar Sesión" />
        <title>ElectroHogar - Login</title>
        <link href="css/estilos.css" rel="stylesheet" type="text/css" />
    </head>
    <body>

        <nav>
            <ul>
                <li><a href="login.html">INICIAR SESIÓN</a></li>
                <li><a href="galeria.html">GALERÍA</a></li>
            </ul>
        </nav>

        <header>
            <a href="index.html"><img src="imagenes/logo.jpeg" alt="Logo ElectroHogar" /></a>
            <a href="index.html"><h2>ElectroHogar</h2></a>
            <p>Tu tienda de electrodomésticos de confianza</p>
        </header>

        <div class="imagen_banner">
            <img src="imagenes/banner.jpg" alt="Banner principal" />
        </div>

        <main>
            <article>
                <form action="" method="post" class="caja_login">
                    <h2>INICIAR SESIÓN</h2>

                    <label for="email">Email</label>
                    <br />
                    <input class="controles" type="text" id="email" name="email" placeholder="Digite su correo" required />
                    <br />
                    <label for="password">Password</label>
                    <br />
                    <input class="controles" type="password" id="password" name="password" placeholder="Digite su contraseña" required />
                    <br />
                    <div>
                        <input class="botones" type="submit" value="Login" />
                    </div>
                </form>
            </article>
        </main>

        <footer>
            <div class="columna_footer">
                <p><strong>Contacto</strong></p>
                <p>Teléfono: (56) 2-1234-5678</p>
                <p>Email: contacto@electrohogar.cl</p>
            </div>
            <div class="columna_footer">
                <p><strong>Horario de Atención</strong></p>
                <p>Lunes a Viernes: 09:00 – 19:00</p>
                <p>Sábado: 10:00 – 14:00</p>
            </div>
            <p class="pie_footer">
                <strong>DESARROLLADOR:</strong> Camilo Dominguez
            </p>
        </footer>

    </body>
</html>
